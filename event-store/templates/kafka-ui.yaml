{{ if .Values.ui.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui-{{ .Release.Name }}
  labels:
    app: kafka-ui-{{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui-{{ .Release.Name }}
  template:
    metadata:
      labels:
        app: kafka-ui-{{ .Release.Name }}
    spec:
      containers:
      - name: kafka-ui-{{ .Release.Name }}
        image: provectuslabs/kafka-ui:latest
        env:
        - name: KAFKA_CLUSTERS_0_NAME
          value: "{{ .Values.kafkaEventStoreName }}"
        - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
          value: {{ .Values.kafkaEventStoreName }}-kafka-bootstrap:9092
        imagePullPolicy: Always
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1024Mi"
            cpu: "1000m"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui-service-{{ .Release.Name }}
spec:
  selector:
    app: kafka-ui-{{ .Release.Name }}
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
{{- end }}
