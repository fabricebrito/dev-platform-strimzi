apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: {{ .Values.kafkaEventStoreName }}
  labels:
    {{- include "kafka-event-store.labels" . | nindent 4 }}
    {{ if .Values.kafkaEventStoreLabels }}
    {{ toYaml .Values.kafkaEventStoreLabels | nindent 4 }}
    {{- end }}
spec:
  kafka:
    version: {{ .Values.kafkaVersion }}
    replicas: 3
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      inter.broker.protocol.version: {{ .Values.brokerProtocolVersion }}
    storage:
      type: jbod
      volumes:
      - id: 0
        type: persistent-claim
        size: {{ .Values.persistenceVolumeSize }}
        deleteClaim: false
  zookeeper:
    replicas: 3
    storage:
      type: persistent-claim
      size: {{ .Values.persistenceVolumeSize }}
      deleteClaim: false
  entityOperator:
    topicOperator: {}
    userOperator: {}
